name: fgv-spexify-server

services:
  spexify-mysql:
    image: 'mysql:8.4'
    restart: unless-stopped
    command: --log-error=/var/log/mysql/error.log
    environment:
      MYSQL_HOST: localhost
      MYSQL_DATABASE: ${FGV_SPEXIFY_MYSQL_DATABASE}
      MYSQL_ROOT_USER: ${FGV_SPEXIFY_MYSQL_ROOT_USER}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/FGV_SPEXIFY_MYSQL_ROOT_PASSWORD
      MYSQL_USER: ${FGV_SPEXIFY_MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/FGV_SPEXIFY_MYSQL_USER_PASSWORD
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    #ports:
    #  - "3308:3306"
    volumes:
      - fgv_spexify_mysql_data:/var/lib/mysql
      - fgv_spexify_mysql_log:/var/log/mysql
    secrets:
      - FGV_SPEXIFY_MYSQL_ROOT_PASSWORD
      - FGV_SPEXIFY_MYSQL_USER_PASSWORD

  spexify-navidrome:
    image: 'deluan/navidrome:0.64.2'
    restart: unless-stopped
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_LOGLEVEL: info
      ND_EXTAUTH_TRUSTEDSOURCES: 0.0.0.0/0
      ND_SUBSONIC_DEFAULTREPORTREALPATH: "true"
      ND_ENABLESHARING: "false"
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_ENABLEEXTERNALSERVICES: "false"
      ND_SCANNER_SCHEDULE: "0"
    healthcheck:
      test: [ "CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:4533/app/" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:4533:4533"
    volumes:
      - ./data/media/music:/music:ro
      - fgv_spexify_navidrome_data:/data

  spexify-api:
    image: 'bloomper/fgv-spexify-server:develop'
    #platform: linux/arm64
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://spexify-mysql/${FGV_SPEXIFY_MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${FGV_SPEXIFY_MYSQL_USER}
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 9000
      LOGGING_FILE_PATH: /data/log_data
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SPEXIFY_KEYCLOAK_URL: http://keycloak-server:8080/auth
      API_KEYCLOAK_REALM: ${API_KEYCLOAK_REALM}
      API_KEYCLOAK_ADMIN_CLIENT_ID: ${API_KEYCLOAK_ADMIN_CLIENT_ID}
      SPEXIFY_NAVIDROME_URL: http://spexify-navidrome:4533
      API_MEDIA_ROOT: /data/media
      API_SPEXREGISTER_GRAPHQL_URL: http://spexregister-api:8080/api/graphql
      API_SPEXFLIX_GRAPHQL_URL: ${API_SPEXFLIX_GRAPHQL_URL:-}
      API_IMPORT_SAMPLE_DATA: ${API_IMPORT_SAMPLE_DATA:-false}
      API_SAMPLE_DATA_SIZE: ${API_SAMPLE_DATA_SIZE:-small}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak-server:8080/auth/realms/fgv/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://auth.fgv.local.nu:8443/auth/realms/fgv
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000;printf \"GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3;grep -q \"^HTTP/1.1 200\" <&3" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      spexify-mysql:
        condition: service_healthy
      spexify-navidrome:
        condition: service_healthy
    volumes:
      - fgv_spexify_api_log:/data/log_data
      - ./data/media:/data/media
    networks:
      - default
      - fgv
    secrets:
      - source: FGV_SPEXIFY_MYSQL_USER_PASSWORD
        target: MYSQL_API_USER_PASSWORD
      - API_KEYCLOAK_ADMIN_CLIENT_SECRET
      - API_KEYCLOAK_SERVICE_CLIENT_SECRET
      - API_APP_PASSWORD_ENCRYPTION_KEY
      - API_MEDIA_SIGNING_KEY

volumes:
  fgv_spexify_mysql_data:
    driver: local
    driver_opts:
      type: none
      device: .docker/fgv-spexify-mysql/data
      o: bind
  fgv_spexify_mysql_log:
    driver: local
    driver_opts:
      type: none
      device: .docker/fgv-spexify-mysql/log
      o: bind
  fgv_spexify_navidrome_data:
    driver: local
    driver_opts:
      type: none
      device: .docker/fgv-spexify-navidrome/data
      o: bind
  fgv_spexify_api_log:
    driver: local
    driver_opts:
      type: none
      device: .docker/fgv-spexify-api/log_data
      o: bind

networks:
  fgv:
    name: fgv-local
    external: true

secrets:
  FGV_SPEXIFY_MYSQL_ROOT_PASSWORD:
    file: .docker/secrets/FGV_SPEXIFY_MYSQL_ROOT_PASSWORD
  FGV_SPEXIFY_MYSQL_USER_PASSWORD:
    file: .docker/secrets/FGV_SPEXIFY_MYSQL_USER_PASSWORD
  API_KEYCLOAK_ADMIN_CLIENT_SECRET:
    file: .docker/secrets/API_KEYCLOAK_ADMIN_CLIENT_SECRET
  API_KEYCLOAK_SERVICE_CLIENT_SECRET:
    file: .docker/secrets/API_KEYCLOAK_SERVICE_CLIENT_SECRET
  API_APP_PASSWORD_ENCRYPTION_KEY:
    file: .docker/secrets/API_APP_PASSWORD_ENCRYPTION_KEY
  API_MEDIA_SIGNING_KEY:
    file: .docker/secrets/API_MEDIA_SIGNING_KEY
