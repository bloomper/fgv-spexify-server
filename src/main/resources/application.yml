spring:
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    password: ${MYSQL_API_USER_PASSWORD:}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
        # Loads the tracks of many albums in one query, not one per album
        default_batch_fetch_size: 100
        transaction:
          jta:
            platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
  messages:
    basename: messages
    fallback-to-system-locale: false
    encoding: UTF-8
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${spexify.keycloak.url}/realms/${spexify.keycloak.realm}
      client:
        registration:
          fgv-spexify-service:
            provider: fgv
            client-id: ${API_KEYCLOAK_SERVICE_CLIENT_ID:fgv-spexify-service}
            client-secret: ${API_KEYCLOAK_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
        provider:
          fgv:
            token-uri: ${spexify.keycloak.url}/realms/${spexify.keycloak.realm}/protocol/openid-connect/token
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  web:
    locale: sv
  graphql:
    schema:
      printer:
        enabled: true
      introspection:
        enabled: false
    http:
      path: /api/graphql

management:
  server:
    port: 9000
  endpoints:
    web:
      exposure:
        include: health,metrics,info

server:
  port: 8080
  forward-headers-strategy: framework
  tomcat:
    # tus chunks are at most 50 MB
    max-swallow-size: 60MB

logging:
  file:
    path: ./data/log_data

spexify:
  time-zone: Europe/Stockholm
  jobs:
    spex-refresh:
      cron-expression: 0 15 3 * * * # Every day at 03:15
    upload-cleanup:
      cron-expression: 0 5 * * * * # Every hour at :05
    loudness-scan:
      cron-expression: 0 45 3 * * * # Every day at 03:45
    listening-sync:
      cron-expression: 0 15 4 * * * # Every day at 04:15
  keycloak:
    url: ${API_KEYCLOAK_URL:https://auth.fgv.local.nu:8443/auth}
    realm: ${API_KEYCLOAK_REALM:fgv}
    # The service account checks that app password owners still have access; it needs realm-management view-users
    service-client-id: ${API_KEYCLOAK_SERVICE_CLIENT_ID:fgv-spexify-service}
    service-client-secret: ${API_KEYCLOAK_SERVICE_CLIENT_SECRET:}
    # Only for the sample data import, which creates users
    admin-client-id: ${API_KEYCLOAK_ADMIN_CLIENT_ID:fgv-admin}
    admin-client-secret: ${API_KEYCLOAK_ADMIN_CLIENT_SECRET:}
  security:
    authorized-parties: ${API_SECURITY_AUTHORIZED_PARTIES:fgv-spexify,fgv-spexflix-service}
    # How long a user's access in Keycloak is trusted before it is checked again, for app passwords
    access-cache: 10m
  media:
    root: ${API_MEDIA_ROOT:./data/media}
    max-track-size: ${API_MAX_TRACK_SIZE:2GB}
    # The API's public address, where signed links to audio and downloads point (API_HOST, outside any CDN)
    public-url: ${API_PUBLIC_URL:https://api.spexify.fgv.local.nu:8443}
    # Signs those links; required
    signing-key: ${API_MEDIA_SIGNING_KEY:}
    # Long enough for a long album or a paused track; the web asks for a new link when one runs out
    link-lifetime: 6h
  navidrome:
    url: ${API_NAVIDROME_URL:http://localhost:4533}
    system-user: ${API_NAVIDROME_SYSTEM_USER:spexify-system}
  crypto:
    # 32 bytes, base64; encrypts app passwords, which Subsonic token authentication needs to read back
    app-password-encryption-key: ${API_APP_PASSWORD_ENCRYPTION_KEY:}
  spexregister:
    graphql-url: ${API_SPEXREGISTER_GRAPHQL_URL:https://api.register.fgv.local.nu:8443/api/graphql}
  spexflix:
    graphql-url: ${API_SPEXFLIX_GRAPHQL_URL:}
  data:
    import-sample-data: ${API_IMPORT_SAMPLE_DATA:false}
    sample-data-size: ${API_SAMPLE_DATA_SIZE:small}
    # Needed only to import sample data; the local profile has a development value
    sample-user-password: ${SAMPLE_USER_PASSWORD:}
    sample-app-password: ${SAMPLE_APP_PASSWORD:sample-app-password-0001}

---
spring:
  config:
    activate:
      on-profile: local
  graphql:
    schema:
      introspection:
        enabled: true
  # The password comes from MYSQL_API_USER_PASSWORD, as in the container
  datasource:
    url: jdbc:mysql://localhost:3308/spexify
    username: spexify

server:
  port: 8082

management:
  server:
    port: 9002

spexify:
  data:
    # For development only; every other environment sets SAMPLE_USER_PASSWORD
    sample-user-password: ${SAMPLE_USER_PASSWORD:s3cr3t-s3cr3t}
  keycloak:
    url: https://auth.fgv.local.nu:8443/auth
  navidrome:
    url: http://localhost:4533
  crypto:
    # A key for development only; every other environment sets API_APP_PASSWORD_ENCRYPTION_KEY
    app-password-encryption-key: ${API_APP_PASSWORD_ENCRYPTION_KEY:c3BleGlmeS1kZXZlbG9wbWVudC1rZXktbm90LXNlY3Jl}
  media:
    # A key for development only; every other environment sets API_MEDIA_SIGNING_KEY
    signing-key: ${API_MEDIA_SIGNING_KEY:spexify-development-signing-key}
