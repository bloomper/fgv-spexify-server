spring:
  config:
    import: "optional:configtree:/run/secrets/"
  datasource:
    password: ${MYSQL_API_USER_PASSWORD:}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
        # Loads the tracks of many albums in one query, not one per album
        default_batch_fetch_size: 100
        transaction:
          jta:
            platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
  messages:
    basename: messages
    fallback-to-system-locale: false
    encoding: UTF-8
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${spexify.keycloak.url}/realms/${spexify.keycloak.realm}
      client:
        registration:
          fgv-spexify-service:
            provider: fgv
            client-id: ${API_KEYCLOAK_SERVICE_CLIENT_ID:fgv-spexify-service}
            client-secret: ${API_KEYCLOAK_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
        provider:
          fgv:
            token-uri: ${spexify.keycloak.url}/realms/${spexify.keycloak.realm}/protocol/openid-connect/token
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  web:
    locale: sv
  graphql:
    schema:
      printer:
        enabled: true
      introspection:
        enabled: false
    http:
      path: /api/graphql
  ai:
    mcp:
      server:
        name: fgv-spexify
        version: 1.0.0
        type: SYNC
        protocol: STATELESS
        streamable-http:
          mcp-endpoint: /api/mcp
        capabilities:
          resource: false
          prompt: false
          completion: false
        instructions: >-
          Spexify is FGV's music service for the songs the spex have recorded over the years. Every call runs with
          the permissions of the signed-in user and returns only what they may see: published albums and tracks
          for listeners, also unpublished ones for editors. Every tool only reads; nothing here plays, downloads,
          uploads or changes anything. An album is a recording of one or more spex (the main one first), in a year,
          with tracks numbered per disc; a track may be linked to a number of its spex in Spexipedia. Performers,
          melodies, lyrics authors and arrangers are free text as the album's editors wrote them. Spex are
          Spexipedia's, as Spexify keeps a copy of them; a revival is a spex of its own, with its original's id.
          Plays, likes and ratings are everyone's, as Navidrome counts them, never per person.

management:
  server:
    port: 9000
  endpoints:
    web:
      exposure:
        include: health,metrics,info

server:
  port: 8080
  request:
    header:
      forwarded:
        strategy: framework
  tomcat:
    # tus chunks are at most 50 MB
    max-swallow-size: 60MB

logging:
  file:
    path: ./data/log_data

spexify:
  time-zone: Europe/Stockholm
  imports:
    # Files received through the import API (Spexipedia's docs/content-import.md, section 4)
    root: ${API_IMPORTS_ROOT:./data/imports}
    keep-files: 7d
  jobs:
    spex-refresh:
      cron-expression: 0 15 3 * * * # Every day at 03:15
    spexipedia-sync:
      cron-expression: 0 */5 * * * * # Every five minutes
    upload-cleanup:
      cron-expression: 0 5 * * * * # Every hour at :05
    loudness-scan:
      cron-expression: 0 45 3 * * * # Every day at 03:45
    listening-sync:
      cron-expression: 0 15 4 * * * # Every day at 04:15
    score-align:
      cron-expression: 0 30 4 * * * # Every day at 04:30
  keycloak:
    url: ${API_KEYCLOAK_URL:https://auth.fgv.local.nu:8443/auth}
    realm: ${API_KEYCLOAK_REALM:fgv}
    # The service account checks that app password owners still have access; it needs realm-management view-users
    service-client-id: ${API_KEYCLOAK_SERVICE_CLIENT_ID:fgv-spexify-service}
    service-client-secret: ${API_KEYCLOAK_SERVICE_CLIENT_SECRET:}
  security:
    authorized-parties: ${API_SECURITY_AUTHORIZED_PARTIES:fgv-spexify,fgv-spexflix-service,fgv-spexipedia-service,fgv-archive-service,fgv-content-migration}
    # How long a user's access in Keycloak is trusted before it is checked again, for app passwords
    access-cache: 10m
  mcp:
    # Only tokens issued to these clients are accepted at /api/mcp, and they are refused everywhere else
    authorized-parties: ${API_KEYCLOAK_MCP_CLIENT_ID:fgv-spexify-mcp}
  media:
    root: ${API_MEDIA_ROOT:./data/media}
    max-track-size: ${API_MAX_TRACK_SIZE:2GB}
    # The API's public address, where signed links to audio and downloads point (API_HOST, outside any CDN)
    public-url: ${API_PUBLIC_URL:https://api.spexify.fgv.local.nu:8443}
    # Signs those links; required
    signing-key: ${API_MEDIA_SIGNING_KEY:}
    # Long enough for a long album or a paused track; the web asks for a new link when one runs out
    link-lifetime: 6h
  navidrome:
    url: ${API_NAVIDROME_URL:http://localhost:4533}
    system-user: ${API_NAVIDROME_SYSTEM_USER:spexify-system}
  crypto:
    # 32 bytes, base64; encrypts app passwords, which Subsonic token authentication needs to read back
    app-password-encryption-key: ${API_APP_PASSWORD_ENCRYPTION_KEY:}
  spexipedia:
    graphql-url: ${API_SPEXIPEDIA_GRAPHQL_URL:https://api.spexipedia.fgv.local.nu:8443/api/graphql}
    web-url: ${SPEXIPEDIA_WEB_URL:}
    sync-enabled: ${API_SPEXIPEDIA_SYNC_ENABLED:true}
    # The credit kinds that are a track's lyrics author and arranger (Spexipedia's default kinds Lyrics and Arrangement)
    lyrics-credit-kind: ${API_SPEXIPEDIA_LYRICS_CREDIT_KIND:01900000-0000-7000-8000-000000000201}
    arrangement-credit-kind: ${API_SPEXIPEDIA_ARRANGEMENT_CREDIT_KIND:01900000-0000-7000-8000-000000000203}
  spexflix:
    graphql-url: ${API_SPEXFLIX_GRAPHQL_URL:}
  archive:
    # Spexarkivet, for the sheet music of tracks' numbers; empty leaves sheet music out
    graphql-url: ${API_ARCHIVE_GRAPHQL_URL:}
    web-url: ${ARCHIVE_WEB_URL:}
  data:
    import-sample-data: ${API_IMPORT_SAMPLE_DATA:false}
    sample-data-size: ${API_SAMPLE_DATA_SIZE:small}
    sample-app-password: ${SAMPLE_APP_PASSWORD:sample-app-password-0001}

---
spring:
  config:
    activate:
      on-profile: local
  graphql:
    schema:
      introspection:
        enabled: true
  # The password comes from MYSQL_API_USER_PASSWORD, as in the container
  datasource:
    url: jdbc:mysql://localhost:3308/spexify
    username: spexify

server:
  port: 8082

management:
  server:
    port: 9002

spexify:
  keycloak:
    url: https://auth.fgv.local.nu:8443/auth
  navidrome:
    url: http://localhost:4533
  crypto:
    # A key for development only; every other environment sets API_APP_PASSWORD_ENCRYPTION_KEY
    app-password-encryption-key: ${API_APP_PASSWORD_ENCRYPTION_KEY:c3BleGlmeS1kZXZlbG9wbWVudC1rZXktbm90LXNlY3Jl}
  media:
    # A key for development only; every other environment sets API_MEDIA_SIGNING_KEY
    signing-key: ${API_MEDIA_SIGNING_KEY:spexify-development-signing-key}
